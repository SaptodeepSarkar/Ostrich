name: Bug report
description: Report a defect in the Ostrich shell
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail to reproduce it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the shell with `qs -p shell`
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `qs log -t 200`, plus any compositor logs.
      render: shell
  - type: input
    id: version
    attributes:
      label: Ostrich version
      description: Output of `cat VERSION` or the release tag.
    validations:
      required: true
  - type: input
    id: quickshell
    attributes:
      label: Quickshell version
      description: Output of `qs --version`.
    validations:
      required: true
  - type: input
    id: compositor
    attributes:
      label: Compositor
      description: Hyprland, Niri, Sway, etc., with version.
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU / driver
      description: For example `AMD RX 6800 (Mesa 25.x)` or `NVIDIA RTX 3070 (proprietary 5xx)`.
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I reproduced this on the latest `dev` or release.
          required: true
